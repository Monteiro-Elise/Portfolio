<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <!--
      Sets initial page language before React loads to ensure correct <html lang="">
      for accessibility (screen readers like NVDA) and prevent mismatch during first render.
    -->
    <script>
      (function () {
        const SUPPORTED_LANGUAGES = ['fr', 'en'];
        const DEFAULT_LANGUAGE = 'en';
        const LANGUAGE_STORAGE_KEY = 'i18nextLng';

        function getLangFromQuery() {
          const params = new URLSearchParams(window.location.search);
          return params.get('lng') || params.get('lang');
        }

        function getLangFromStorage() {
          try {
            return localStorage.getItem(LANGUAGE_STORAGE_KEY);
          } catch {
            return null;
          }
        }

        function getLangFromNavigator() {
          return navigator.language || navigator.userLanguage;
        }

        let lang =
          getLangFromQuery() ||
          getLangFromStorage() ||
          getLangFromNavigator()?.split('-')[0];
        lang = SUPPORTED_LANGUAGES.includes(lang) ? lang : DEFAULT_LANGUAGE;

        // Initialize i18n language and sync HTML lang attribute
        localStorage.setItem(LANGUAGE_STORAGE_KEY, lang);
        document.documentElement.setAttribute('lang', lang);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
